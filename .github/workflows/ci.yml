name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "apps/website/**"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "apps/website/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Only building here, never launching Electron — skip the binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Lint & format (Biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  macos-native:
    name: macOS Native Addon
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/macos-helper

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Lint & format (Rust)
        working-directory: packages/macos-helper
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      # Compiles the Rust addon (napi-rs). No Electron ABI rebuild follows: the
      # addon is Node-API, so this same binary is the one Electron loads.
      - name: Build (napi)
        run: pnpm build

      # Loading it here is what catches an export that was added to the Rust but
      # not wired into the JS wrapper — a build that quietly did nothing looks
      # identical to a successful one otherwise.
      - name: Load the addon
        run: node .github/scripts/check-macos-addon.mjs
  windows-native:
    name: Windows Native Addon
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/windows-helper

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Lint & format (Rust)
        working-directory: packages/windows-helper
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      # Compiles the Rust addon (napi-rs). No Electron ABI rebuild follows: the
      # addon is Node-API, so this same binary is the one Electron loads.
      - name: Build (napi)
        run: pnpm build

      # Loading it here is what catches an export that was added to the Rust but
      # not wired into the JS wrapper — a build that quietly did nothing looks
      # identical to a successful one otherwise.
      - name: Load the addon
        run: node .github/scripts/check-windows-addon.mjs
